{% extends 'base.html' %}
{% block title %}Categorias{% endblock %}

{% block content %}
<h2>Categorias</h2>
<ul>
    {% for category in categories %}
        <li>
            <a href="{% url 'category-detail' category.pk %}">
                {{ category.name }}
            </a>
        </li>
    {% empty %}
        <p>Nenhuma categoria cadastrada.</p>
    {% endfor %}
</ul>
{% endblock %}
