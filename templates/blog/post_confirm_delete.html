{% extends 'base.html' %}

{% block title %}Remover post{% endblock %}

{% block content %}
    <h2>Remover post</h2>

    <p>Tem certeza que deseja remover o post <strong>"{{ post.title }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, remover</button>
        <a href="{% url 'post-detail' post.pk %}">Cancelar</a>
    </form>
{% endblock %}
